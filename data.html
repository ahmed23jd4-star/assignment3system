<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and sort a JavaScript data table.">
    <title>Data table | Web Basics</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/data.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <h1 id="site-title">Web Basics</h1>
        <p class="tagline">Small steps to build your first website</p>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a>
            <a href="components.html">Components</a><a href="registration.html">Register</a><a href="data.html" aria-current="page">Data table</a>
        </nav>
    </header>
    <main id="main-content">
        <section aria-labelledby="people-title">
            <h2 id="people-title">People directory</h2>
            <p>Search across the directory as you type, or sort the table by name and age.</p>
            <div class="form-field">
                <label for="table-search">Search people</label>
                <input id="table-search" type="search" placeholder="Search name, age, or city" aria-controls="people-table">
            </div>
            <div class="table-actions" aria-label="Sort table">
                <button type="button" id="sort-name">Sort by name</button>
                <button type="button" id="sort-age">Sort by age</button>
            </div>
            <p id="table-status" role="status" aria-live="polite"></p>
            <div class="table-wrap">
                <table id="people-table">
                    <caption>Sample people, ages, and cities</caption>
                    <thead><tr><th scope="col">Name</th><th scope="col">Age</th><th scope="col">City</th></tr></thead>
                    <tbody id="people-rows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer><p>&copy; 2026 Web Basics</p></footer>
</body>
</html>
