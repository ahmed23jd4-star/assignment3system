<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Web Basics with a question.">
    <title>Contact | Web Basics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <h1 id="site-title">Contact Us</h1>
        <p class="tagline">We are happy to hear from you</p>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" aria-current="page">Contact</a>
            <a href="components.html">Components</a>
            <a href="registration.html">Register</a>
            <a href="data.html">Data table</a>
        </nav>
    </header>
    <main id="main-content">
        <section>
            <h2>Get in touch</h2>
            <p>Fill out the form and tell us what you would like to learn.</p>
            <div class="alert" role="status"><strong>Tip:</strong> Fields marked with * are required.</div>
            <form action="#" method="get">
                <div class="form-field">
                    <label for="name">Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel">
                </div>
                <div class="form-field">
                    <label for="date">Best date to contact you</label>
                    <input type="date" id="date" name="date">
                </div>
                <div class="form-field">
                    <label for="subject">Choose a subject</label>
                    <select id="subject" name="subject">
                        <option value="web-basics">Web Basics</option>
                        <option value="databases">Databases</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <fieldset>
                    <legend>Topics you like (optional)</legend>
                    <div class="choice-row">
                        <label><input type="checkbox" name="topic" value="html"> HTML</label>
                        <label><input type="checkbox" name="topic" value="css"> CSS</label>
                        <label><input type="checkbox" name="topic" value="javascript"> JavaScript</label>
                    </div>
                </fieldset>
                <div class="form-field">
                    <label for="message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Send message</button>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 Web Basics</p></footer>
</body>
</html>
